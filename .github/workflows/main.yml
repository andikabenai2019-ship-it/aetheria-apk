name: Build AETHERIA // RW-14 Official APK (Auto-Version)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Source Bundle
        run: |
          echo "Current directory contents:"
          ls -la
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting archive: $z"
              unzip -o -q "$z"
            fi
          done
          if [ ! -d "android-app" ]; then
            SUB_ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$SUB_ZIP" ] && [ -f "$SUB_ZIP" ]; then
              echo "Found nested archive: $SUB_ZIP"
              unzip -o -q "$SUB_ZIP"
            fi
          fi
          if [ -d "android-app" ]; then
            echo "Directory android-app confirmed:"
            ls -la android-app
          else
            echo "ERROR: Directory android-app not found after extraction!"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Latest APK
        id: build_apk
        working-directory: ./android-app
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Built APK located at: $APK_PATH"
            cp "$APK_PATH" "app/build/outputs/apk/debug/AETHERIA-RW14-v31.2.0-ULTRA-FINISHING-PRO.apk"
            cp "$APK_PATH" app/build/outputs/apk/debug/AETHERIA-RW14-Quantum-v27.5-Universal.apk
          else
            echo "ERROR: No APK generated by Gradle assembleDebug!"
            exit 1
          fi

      - name: Upload AETHERIA Latest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIA-RW14-v31.2.0-ULTRA-FINISHING-PRO-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
