name: Build AETHERIA // RW-14 Official APK (Auto-Version)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Source Bundle (if uploaded as ZIP)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE, extracting..."
            unzip -o "$ZIP_FILE"
          fi
          if [ -d "android-app" ]; then
            ls -la android-app
          else
            echo "ERROR: Directory android-app not found in repository root!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Latest APK
        id: build_apk
        working-directory: ./android-app
        run: |
          VER=$(grep 'val currentApkVersionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then VER="31.2.0-ULTRA-FINISHING-PRO"; fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          gradle assembleDebug --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Built APK located at: $APK_PATH"
            cp "$APK_PATH" "app/build/outputs/apk/debug/AETHERIA-RW14-v${VER}.apk"
            cp "$APK_PATH" app/build/outputs/apk/debug/AETHERIA-RW14-Quantum-v27.5-Universal.apk
          else
            echo "ERROR: No APK generated by Gradle assembleDebug!"
            exit 1
          fi

      - name: Upload AETHERIA Latest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIA-RW14-v${{ steps.build_apk.outputs.version }}-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
