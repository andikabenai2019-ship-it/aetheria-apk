name: Build AETHERIA // RW-14 Official APK (Auto-Version)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Source Bundle (if uploaded as ZIP)
        run: |
          if [ -f "aetheria_android_source.zip" ]; then
            echo "Found aetheria_android_source.zip, extracting..."
            unzip -o aetheria_android_source.zip
          fi
          ls -la android-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Unit Tests & Build Latest APK
        id: build_apk
        working-directory: ./android-app
        run: |
          VER=$(grep 'val currentApkVersionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then VER="28.5.0-3D-HD"; fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AETHERIA-RW14-v${VER}.apk"

      - name: Upload AETHERIA Latest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIA-RW14-v${{ steps.build_apk.outputs.version }}-APK
          path: android-app/app/build/outputs/apk/debug/AETHERIA-RW14-v${{ steps.build_apk.outputs.version }}.apk
